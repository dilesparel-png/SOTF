<title>STUDENT OF THE FUTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FF; --surface:#FFFFFF; --ink:#14183E; --muted:#555A82; --line:#DCE1F4;
  --mat:#3D5AFE; --kim:#087F5F; --fis:#D9432A; --bio:#4F8A00; --eng:#7A35E0; --pkn:#B5155F;
  --sun:#FFC93C; --on-sun:#14183E; --good:#0B8A5F; --bad:#C8283D; --soft:#E8ECFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1130; --surface:#181C47; --ink:#EEF0FF; --muted:#A6ABD8; --line:#2C3172; --soft:#232860;
    --good:#3DDC97; --bad:#FF7A8C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1130; --surface:#181C47; --ink:#EEF0FF; --muted:#A6ABD8; --line:#2C3172; --soft:#232860;
  --good:#3DDC97; --bad:#FF7A8C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,summary,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-appearance:none;appearance:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mat);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 110px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.1}
h2{font-size:1.45rem;margin-bottom:12px}
h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .logo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--mat);color:#fff;font-size:.95rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.navd{display:none;gap:4px}
.navd button,.navb button{background:none;border:0;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--muted)}
.navd button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.navb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.navb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;padding:6px 2px}
.navb button span{font-size:1.25rem;line-height:1}
.navb button[aria-current="page"]{color:var(--mat);background:var(--soft)}
@media (min-width:760px){.navd{display:flex}.navb{display:none}.wrap{padding-bottom:50px}}

.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center;padding:10px 0 6px}
@media (min-width:760px){.hero{grid-template-columns:1.5fr 1fr}}
.wordmark{font-weight:800;font-size:clamp(2.6rem,9vw,4.8rem);line-height:.92;letter-spacing:-.04em}
.wordmark span{display:block}
.wordmark .w2{color:var(--mat);padding-left:.55em}
.wordmark .w3{padding-left:1.1em}
.lede{margin-top:14px;max-width:46ch;color:var(--muted);font-size:1.05rem}
.me{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--soft);stroke-width:10}
.ring .v{fill:none;stroke:var(--mat);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.7rem}
.me .who{font-weight:700;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--soft);font-size:.82rem;font-weight:600;border:0}
.namebox{display:flex;gap:6px;margin-top:8px}
.namebox input{flex:1;min-width:0;font-size:16px;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:var(--bg);color:var(--ink)}

.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:active{transform:translateY(1px)}

section.blk{margin-top:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}

.daily{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:var(--sun);color:var(--on-sun);border-radius:22px;padding:20px 22px;margin-top:22px}
.daily h3{font-size:1.4rem}
.daily p{max-width:42ch;margin-top:4px}
.daily .btn{background:var(--on-sun);color:#fff}
.daily .btn[disabled]{opacity:.6}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;aspect-ratio:1/1.08;border:0;border-radius:16px;padding:12px;text-align:left;color:#fff;background:var(--c);display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .top1{font-size:.8rem;font-weight:700;opacity:.95}
.tile .sym{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;letter-spacing:-.04em}
.tile .nm{font-weight:700;font-size:1rem}
.tile .sub{font-size:.78rem;opacity:.92}
.tile[data-s="mat"]{--c:var(--mat)}.tile[data-s="kim"]{--c:var(--kim)}.tile[data-s="fis"]{--c:var(--fis)}.tile[data-s="bio"]{--c:var(--bio)}.tile[data-s="eng"]{--c:var(--eng)}.tile[data-s="pkn"]{--c:var(--pkn)}

.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:.78rem;font-weight:700;background:var(--soft)}
.tag.open{background:#D6F5E6;color:#05603F}
.tag.soon{background:#FFE9B8;color:#6B4600}
.tag.closed{background:#FFD9DE;color:#8E1226}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem;margin-top:10px}
.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.filters .chip{border:1.5px solid transparent;white-space:nowrap;padding:7px 14px}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.notice{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.star{background:none;border:0;font-size:1.3rem;line-height:1}

.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb li:last-child{border:0}
.lb .pos{width:28px;font-family:var(--display);font-weight:800}
.lb .nm{flex:1;font-weight:600}
.lb .me1{background:var(--soft);border-radius:10px;padding-left:10px;padding-right:10px}

.back{background:none;border:0;font-weight:700;color:var(--muted);padding:6px 0;margin-bottom:6px}
.subhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.subhead .sym{display:grid;place-items:center;width:64px;height:64px;border-radius:14px;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:1.9rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 16px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700;padding:12px 0;font-family:var(--display);font-size:1.05rem}
details ul{margin:0 0 10px;padding-left:20px}
details li{margin-bottom:6px}
.fact{background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0 14px;font-size:.92rem}

.qwrap{max-width:680px;margin:6px auto 0}
.qtop{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--mat));border-radius:99px;transition:width .3s}
.bar.timer i{background:var(--sun);transition:none}
.qcard{margin-top:16px}
.qcard .q{font-family:var(--display);font-size:1.4rem;line-height:1.25;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--mat)}
.opt.ok{border-color:var(--good);background:var(--soft);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:var(--soft);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.expl{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.result{text-align:center;padding:26px 18px}
.result .big{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1}
.stars{font-size:2rem;letter-spacing:6px;margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}

.req{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.95rem}
.req input{width:20px;height:20px;margin-top:2px;accent-color:var(--kim)}

.badges{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.badges{grid-template-columns:repeat(4,1fr)}}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:center}
.badge .e{font-size:2rem}
.badge.lock{opacity:.5;filter:grayscale(1)}
.badge b{display:block;font-size:.92rem}
.badge small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;z-index:50;max-width:92vw;text-align:center}
.foot{margin-top:36px;font-size:.84rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wordmark{animation:rise .6s ease-out both}
</style>

 {id:"first",e:"🚀",n:"First Step",d:"Finish 1 practice set",ok:function(){return S.quizzes>=1;}},
 {id:"perfect",e:"💯",n:"Perfect Score",d:"Answer every question correctly",ok:function(){return S.perfect;}},
 {id:"explorer",e:"🧪",n:"Science Explorer",d:"Try all six subjects",ok:function(){return KEYS.every(function(k){return S.played[k];});}},
 {id:"daily",e:"⚡",n:"Daily Fighter",d:"Complete a daily challenge",ok:function(){return !!S.dailyDone;}},
 {id:"hunter",e:"🎓",n:"Scholarship Hunter",d:"Tick 3 requirements",ok:function(){return reqCount()>=3;}},
 {id:"lv3",e:"⭐",n:"Level 3",d:"Reach level 3",ok:function(){return level()>=3;}},
 {id:"streak3",e:"🔥",n:"On Fire",d:"Study 3 days in a row",ok:function(){return S.streak>=3;}},
 {id:"saver",e:"🏆",n:"Future Champion",d:"Save 2 competitions",ok:function(){return S.saved.length>=2;}}
];

/* ---------- helpers ---------- */
function level(){return Math.floor(S.xp/100)+1;}
function reqCount(){var n=0;Object.keys(S.reqs).forEach(function(k){(S.reqs[k]||[]).forEach(function(v){if(v)n++;});});return n;}
function fmtDate(s){return new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});}
function daysLeft(s){var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+"T00:00:00")-t)/86400000);}
function plural(n,w){return n+" "+w+(n===1?"":"s");}
function status(s){var d=daysLeft(s);if(d<0)return {c:"closed",t:"Closed"};if(d<=14)return {c:"soon",t:"Closing soon ("+plural(d,"day")+" left)"};return {c:"open",t:"Open ("+plural(d,"day")+" left)"};}
function shuffle(a,rnd){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function toast(msg){var b=$("#toastbox");b.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(function(){b.innerHTML="";},3200);}
function checkBadgesQuiet(){var got=[];BADGES.forEach(function(b){if(S.badges.indexOf(b.id)<0&&b.ok()){S.badges.push(b.id);got.push(b);}});save();return got;}
function checkBadges(){var got=checkBadgesQuiet();if(got.length){toast("New badge: "+got.map(function(b){return b.e+" "+b.n;}).join(", "));}return got;}
function touchStreak(){var t=dayStr();if(S.lastDay===t)return;var y=new Date();y.setDate(y.getDate()-1);S.streak=(S.lastDay===dayStr(y))?S.streak+1:1;S.lastDay=t;}

/* ---------- app state ---------- */
var V={page:"home",subj:null,tab:"lessons",filter:"all",quiz:null,confirmReset:false};
var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}

var NAV=[["home","🏠","Home"],["learn","📚","Learn"],["contest","🏆","Contests"],["scholar","🎓","Scholarships"],["me","👤","Profile"]];
function renderNav(){
  var d=NAV.map(function(n){return '<button data-act="nav" data-p="'+n[0]+'"'+(V.page===n[0]?' aria-current="page"':'')+'>'+n[2]+'</button>';}).join("");
  var b=NAV.map(function(n){return '<button data-act="nav" data-p="'+n[0]+'"'+(V.page===n[0]?' aria-current="page"':'')+'><span aria-hidden="true">'+n[1]+'</span>'+n[2]+'</button>';}).join("");
  $("#navd").innerHTML=d;$("#navb").innerHTML=b;
}

/* ---------- views ---------- */
function ringSvg(){var C=2*Math.PI*48,p=(S.xp%100)/100;return '<div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="t" cx="56" cy="56" r="48"/><circle class="v" cx="56" cy="56" r="48" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p)).toFixed(1)+'"/></svg><b>Lv '+level()+'</b></div>';}
function tilesHtml(){return '<div class="tiles">'+KEYS.map(function(k){var s=SUBJ[k],n=(S.right[k]||[]).length,b=S.best[k];return '<button class="tile" data-s="'+k+'" data-act="openSubj" data-k="'+k+'"><span class="top1">'+n+'/'+s.qs.length+' correct</span><span class="sym">'+s.sym+'</span><span><span class="nm">'+s.name+'</span><br><span class="sub">'+(b!=null?'Best score '+b+'/'+s.qs.length:'Not tried yet')+'</span></span></button>';}).join("")+'</div>';}
function contestCard(c){
  var st=status(c.reg),sv=S.saved.indexOf(c.id)>=0;
  var tags=c.m.map(function(m){return '<span class="tag">'+(m==="umum"?"General":SUBJ[m].name)+'</span>';}).join(" ");
  return '<article class="card"><div class="row"><h3>'+esc(c.n)+'</h3><button class="star" data-act="save" data-id="'+c.id+'" aria-label="'+(sv?'Remove from saved':'Save contest')+'" aria-pressed="'+sv+'">'+(sv?'★':'☆')+'</button></div><p class="muted" style="font-size:.9rem">'+esc(c.org)+'</p><div class="chips" style="margin-top:8px">'+tags+'<span class="tag '+st.c+'">'+st.t+'</span></div><p style="margin-top:10px">'+esc(c.d)+'</p><dl class="meta"><dt>Level</dt><dd>'+esc(c.lv)+'</dd><dt>Format</dt><dd>'+esc(c.mode)+'</dd><dt>Register by</dt><dd>'+fmtDate(c.reg)+'</dd><dt>Event date</dt><dd>'+fmtDate(c.ev)+'</dd><dt>Fee</dt><dd>'+esc(c.fee)+'</dd></dl></article>';
}
function viewHome(){
  var greet=S.name?('Hi, '+esc(S.name)+'!'):'Hi, future champion!';
  var nameBox=S.name?'':'<div class="namebox"><input id="nameIn" maxlength="20" placeholder="What is your name?" aria-label="Your name"><button class="btn sm" data-act="setName">Save</button></div>';
  var daily=S.dailyDone===dayStr();
  var board=RIVALS.concat([{n:S.name||"You",x:S.xp,me:true}]).sort(function(a,b){return b.x-a.x;});
  var upcoming=CONTESTS.filter(function(c){return daysLeft(c.reg)>=0;}).sort(function(a,b){return a.reg<b.reg?-1:1;}).slice(0,2);
  return '<section class="hero"><div><h1 class="wordmark" aria-label="Student of the Future"><span>STUDENT</span><span class="w2">OF THE</span><span class="w3">FUTURE</span></h1><p class="lede">Learn Grade 7 Math, Science, English, and Civics through short lessons, practice questions, and daily challenges. Earn XP, unlock badges, and get ready for the olympiads.</p></div><div class="me">'+ringSvg()+'<div><p class="who">'+greet+'</p><p class="muted" style="font-size:.9rem">'+(S.xp%100)+' / 100 XP to level '+(level()+1)+'</p><div class="chips"><span class="chip">🔥 '+plural(S.streak,"day")+' in a row</span><span class="chip">✨ '+S.xp+' XP</span></div>'+nameBox+'</div></div></section>'
  +'<div class="daily"><div><h3>Daily challenge</h3><p>'+(daily?('You finished today\'s challenge with a score of '+S.dailyScore+'/5. Come back tomorrow!'):'5 mixed questions from all 6 subjects, 25 seconds each. Finish it for bonus XP.')+'</p></div><button class="btn" data-act="daily"'+(daily?' disabled':'')+'>'+(daily?'Done for today':'Start challenge')+'</button></div>'
  +'<section class="blk"><h2>Choose a subject</h2>'+tilesHtml()+'</section>'
  +'<section class="blk"><div class="row"><h2>Upcoming contests</h2><button class="btn ghost sm" data-act="nav" data-p="contest">See all</button></div><div class="grid2">'+upcoming.map(contestCard).join("")+'</div></section>'
  +'<section class="blk"><h2>Class leaderboard (sample)</h2><div class="card"><ol class="lb">'+board.map(function(r,i){return '<li class="'+(r.me?'me1':'')+'"><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(r.n)+'</span><span>'+r.x+' XP</span></li>';}).join("")+'</ol></div></section>';
}
function viewLearn(){
  if(!V.subj){return '<section class="blk" style="margin-top:10px"><h2>Learn</h2><p class="muted" style="margin-bottom:14px">Pick a subject to read quick lessons or take a practice set.</p>'+tilesHtml()+'</section>';}
  var k=V.subj,s=SUBJ[k],b=S.best[k];
  var head='<button class="back" data-act="backSubj">← All subjects</button><div class="subhead" style="--c:'+SUBJ_COLOR[k]+'"><div class="sym">'+s.sym+'</div><div><h2 style="margin:0">Grade 7 '+s.name+'</h2><p class="muted">'+s.topics.length+' topics, '+s.qs.length+' practice questions</p></div></div><div class="tabs" role="tablist"><button role="tab" aria-selected="'+(V.tab==="lessons")+'" data-act="tab" data-t="lessons">Lessons</button><button role="tab" aria-selected="'+(V.tab==="practice")+'" data-act="tab" data-t="practice">Practice</button></div>';
  if(V.tab==="lessons"){
    return head+s.topics.map(function(t,i){return '<details'+(i===0?' open':'')+'><summary>'+esc(t.t)+'</summary><ul>'+t.p.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul><p class="fact"><b>Did you know?</b> '+esc(t.f)+'</p></details>';}).join("");
  }
  return head+'<div class="card"><h3>'+s.name+' practice</h3><p class="muted" style="margin:6px 0 14px">'+s.qs.length+' multiple-choice questions. Question and answer order is shuffled every time. Each correct answer earns +10 XP, and a perfect score earns a +20 XP bonus.</p><p style="margin-bottom:14px"><b>Best score:</b> '+(b!=null?b+'/'+s.qs.length:'none yet')+'</p><button class="btn" data-act="startQuiz" data-k="'+k+'">Start practice</button></div>';
}
function viewContest(){
  var f=V.filter;
  var opts=[["all","All"],["mat","Mathematics"],["kim","Chemistry"],["fis","Physics"],["bio","Biology"],["eng","English"],["pkn","Civics"],["umum","General"],["saved","Saved"]];
  var list=CONTESTS.filter(function(c){return f==="all"||(f==="saved"?S.saved.indexOf(c.id)>=0:c.m.indexOf(f)>=0);}).sort(function(a,b){return a.reg<b.reg?-1:1;});
  return '<section class="blk" style="margin-top:10px"><h2>Olympiads and contests</h2><p class="notice">All contest data on this page is fictional sample data for demonstration only.</p><div class="filters" role="group" aria-label="Filter contests">'+opts.map(function(o){return '<button class="chip" data-act="filter" data-f="'+o[0]+'" aria-pressed="'+(f===o[0])+'">'+o[1]+'</button>';}).join("")+'</div>'+(list.length?'<div class="grid2">'+list.map(contestCard).join("")+'</div>':'<div class="card"><p>No contests in this category yet. Try another filter, or tap ☆ on a contest card to save it.</p></div>')+'</section>';
}
function viewScholar(){
  return '<section class="blk" style="margin-top:10px"><h2>Scholarships</h2><p class="notice">All scholarships on this page are fictional samples. Tick the requirements you have prepared to track your progress.</p><div class="grid2">'+SCHOL.slice().sort(function(a,b){return a.dl<b.dl?-1:1;}).map(function(s){
    var c=S.reqs[s.id]||[],n=c.filter(Boolean).length,st=status(s.dl),pct=Math.round(n/s.r.length*100);
    return '<article class="card"><h3>'+esc(s.n)+'</h3><p class="muted" style="font-size:.9rem">'+esc(s.org)+'</p><div class="chips" style="margin-top:8px"><span class="tag '+st.c+'">'+st.t+'</span></div><dl class="meta"><dt>Benefit</dt><dd>'+esc(s.b)+'</dd><dt>Deadline</dt><dd>'+fmtDate(s.dl)+'</dd></dl><h3 style="font-size:.98rem;margin:14px 0 4px">Requirements ('+n+'/'+s.r.length+')</h3><div class="bar" style="--c:var(--kim);margin-bottom:6px"><i style="width:'+pct+'%"></i></div>'+s.r.map(function(r,i){return '<label class="req"><input type="checkbox" data-act="req" data-id="'+s.id+'" data-i="'+i+'"'+(c[i]?' checked':'')+'><span>'+esc(r)+'</span></label>';}).join("")+'</article>';
  }).join("")+'</div></section>';
}
function viewMe(){
  var th=[["auto","Auto"],["light","Light"],["dark","Dark"]];
  var total=0;KEYS.forEach(function(k){total+=(S.right[k]||[]).length;});
  return '<section class="blk" style="margin-top:10px"><h2>Profile</h2><div class="card"><div class="row" style="flex-wrap:wrap"><div><p style="font-weight:700;font-size:1.15rem">'+esc(S.name||"Future champion")+'</p><p class="muted">Level '+level()+', '+S.xp+' XP, '+plural(S.streak,"day")+' in a row</p></div></div><div class="namebox"><input id="nameIn" maxlength="20" value="'+esc(S.name)+'" placeholder="Change name" aria-label="Your name"><button class="btn sm" data-act="setName">Save name</button></div><p class="muted" style="margin-top:12px">Different questions answered correctly: '+total+' of '+(KEYS.length*8)+'. Practice sets finished: '+S.quizzes+'.</p></div>'
  +'<section class="blk"><h2>Badges ('+S.badges.length+'/'+BADGES.length+')</h2><div class="badges">'+BADGES.map(function(b){var on=S.badges.indexOf(b.id)>=0;return '<div class="badge'+(on?'':' lock')+'"><div class="e" aria-hidden="true">'+b.e+'</div><b>'+b.n+'</b><small>'+b.d+'</small></div>';}).join("")+'</div></section>'
  +'<section class="blk"><h2>Settings</h2><div class="card"><p style="margin-bottom:8px"><b>Appearance</b></p><div class="filters" role="group" aria-label="Theme">'+th.map(function(t){return '<button class="chip" data-act="theme" data-t="'+t[0]+'" aria-pressed="'+(S.theme===t[0])+'">'+t[1]+'</button>';}).join("")+'</div><p class="muted" style="font-size:.9rem;margin-bottom:10px">Progress is saved in this browser on this device.</p>'+(V.confirmReset?'<p style="margin-bottom:8px"><b>Delete all progress and start over?</b></p><button class="btn sm" style="background:var(--bad);color:#fff" data-act="reset">Yes, delete</button> <button class="btn ghost sm" data-act="cancelReset">Cancel</button>':'<button class="btn ghost sm" data-act="askReset">Reset progress</button>')+'</div></section></section>';
}

/* ---------- quiz ---------- */
function buildQuiz(mode,k){
  var rnd=seeded(mode==="daily"?parseInt(dayStr().replace(/-/g,""),10):Math.floor(Math.random()*1e9));
  var pool=[];
  if(mode==="daily"){KEYS.forEach(function(kk){SUBJ[kk].qs.forEach(function(q,i){pool.push({s:kk,i:i,q:q});});});pool=shuffle(pool,rnd).slice(0,5);}
  else{SUBJ[k].qs.forEach(function(q,i){pool.push({s:k,i:i,q:q});});pool=shuffle(pool,rnd);}
  var r2=Math.random;
  var items=pool.map(function(p){var idx=shuffle([0,1,2,3],r2);return {s:p.s,i:p.i,q:p.q.q,o:idx.map(function(j){return p.q.o[j];}),a:idx.indexOf(p.q.a),e:p.q.e};});
  return {mode:mode,k:k,items:items,n:0,score:0,picked:null,done:false,xpGain:0,newBadges:[]};
}
function startTimer(){
  stopTimer();var Q=V.quiz;if(!Q||Q.mode!=="daily"||Q.picked!==null||Q.done)return;
  var t0=Date.now();
  timer=setInterval(function(){
    var el=Date.now()-t0,left=Math.max(0,25-el/1000),bar=$("#tbar");
    if(bar)bar.style.width=(left/25*100)+"%";
    if(left<=0){stopTimer();answer(-1);}
  },100);
}
function viewQuiz(){
  var Q=V.quiz,col=Q.mode==="daily"?"var(--sun)":SUBJ_COLOR[Q.k];
  var title=Q.mode==="daily"?"Daily challenge":SUBJ[Q.k].name;
  if(Q.done){
    var tot=Q.items.length,stars=Q.score===tot?3:Q.score/tot>=0.6?2:Q.score>0?1:0;
    var starStr="★".repeat(stars)+"☆".repeat(3-stars);
    var msg=Q.score===tot?"Perfect! You are outstanding.":Q.score/tot>=0.6?"Great job! Almost perfect.":"Keep going. Read the lessons and try again.";
    return '<div class="qwrap"><div class="card result"><p class="muted">'+title+' complete</p><div class="big">'+Q.score+'/'+tot+'</div><div class="stars" style="color:var(--sun)" aria-label="'+stars+' out of 3 stars">'+starStr+'</div><p>'+msg+'</p><p style="margin-top:8px"><b>+'+Q.xpGain+' XP</b> earned</p>'+(Q.newBadges.length?'<p style="margin-top:8px">New badge: '+Q.newBadges.map(function(b){return b.e+" "+esc(b.n);}).join(", ")+'</p>':'')+'<div class="actions">'+(Q.mode==="daily"?'':'<button class="btn" data-act="startQuiz" data-k="'+Q.k+'">Practice again</button>')+'<button class="btn ghost" data-act="exitQuiz">'+(Q.mode==="daily"?"Back to home":"Back to subject")+'</button></div></div></div>';
  }
  var it=Q.items[Q.n],L=["A","B","C","D"];
  var opts=it.o.map(function(o,i){var cls="opt";if(Q.picked!==null){if(i===it.a)cls+=" ok";else if(i===Q.picked)cls+=" bad";}return '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(Q.picked!==null?' disabled':'')+'>'+L[i]+'. '+esc(o)+'</button>';}).join("");
  var fb="";
  if(Q.picked!==null){var ok=Q.picked===it.a;fb='<div class="expl"><b>'+(ok?"Correct! +10 XP":(Q.picked===-1?"Time is up.":"Not quite."))+'</b><br>'+esc(it.e)+'</div><div class="actions" style="justify-content:flex-end"><button class="btn" data-act="next">'+(Q.n===Q.items.length-1?"See results":"Next question")+'</button></div>';}
  return '<div class="qwrap" style="--c:'+col+'"><button class="back" data-act="exitQuiz">← Exit</button><div class="qtop"><span>'+title+'</span><span>Question '+(Q.n+1)+' of '+Q.items.length+'</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+Q.items.length+'" aria-valuenow="'+Q.n+'"><i style="width:'+(Q.n/Q.items.length*100)+'%"></i></div>'+(Q.mode==="daily"?'<div class="bar timer" style="margin-top:8px" aria-hidden="true"><i id="tbar" style="width:100%"></i></div>':'')+'<div class="card qcard"><p class="q">'+esc(it.q)+'</p>'+opts+fb+'</div></div>';
}
function answer(i){
  var Q=V.quiz;if(!Q||Q.picked!==null)return;
  stopTimer();Q.picked=i;var it=Q.items[Q.n];
  if(i===it.a){
    Q.score++;Q.xpGain+=10;S.xp+=10;
    var arr=S.right[it.s]=S.right[it.s]||[];if(arr.indexOf(it.i)<0)arr.push(it.i);
  }
  save();render();
}
function finishQuiz(){
  var Q=V.quiz,tot=Q.items.length;Q.done=true;
  if(Q.score===tot){Q.xpGain+=20;S.xp+=20;S.perfect=true;}
  if(Q.mode==="daily"){S.dailyDone=dayStr();S.dailyScore=Q.score;Q.xpGain+=10;S.xp+=10;}
  else{S.played[Q.k]=true;if(S.best[Q.k]==null||Q.score>S.best[Q.k])S.best[Q.k]=Q.score;}
  S.quizzes++;touchStreak();
  Q.newBadges=checkBadgesQuiet();
  save();render();
}

/* ---------- render + events ---------- */
function render(){
  stopTimer();
  var v=$("#view");
  if(V.quiz){v.innerHTML=viewQuiz();startTimer();}
  else{v.innerHTML={home:viewHome,learn:viewLearn,contest:viewContest,scholar:viewScholar,me:viewMe}[V.page]();}
  renderNav();
}
function go(p){V.page=p;V.quiz=null;V.confirmReset=false;if(p!=="learn"){V.subj=null;V.tab="lessons";}render();window.scrollTo(0,0);}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act");
  switch(a){
    case "nav":go(el.getAttribute("data-p"));break;
    case "openSubj":V.page="learn";V.subj=el.getAttribute("data-k");V.tab="lessons";render();window.scrollTo(0,0);break;
    case "backSubj":V.subj=null;render();break;
    case "tab":V.tab=el.getAttribute("data-t");render();break;
    case "startQuiz":V.page="learn";V.subj=el.getAttribute("data-k");V.quiz=buildQuiz("subject",V.subj);render();window.scrollTo(0,0);break;
    case "daily":if(S.dailyDone!==dayStr()){V.quiz=buildQuiz("daily");render();window.scrollTo(0,0);}break;
    case "pick":answer(parseInt(el.getAttribute("data-i"),10));break;
    case "next":var Q=V.quiz;if(Q.n>=Q.items.length-1){finishQuiz();}else{Q.n++;Q.picked=null;render();}break;
    case "exitQuiz":stopTimer();var wasDaily=V.quiz&&V.quiz.mode==="daily";V.quiz=null;if(wasDaily){V.page="home";}render();window.scrollTo(0,0);break;
    case "filter":V.filter=el.getAttribute("data-f");render();break;
    case "save":var id=el.getAttribute("data-id"),ix=S.saved.indexOf(id);if(ix<0)S.saved.push(id);else S.saved.splice(ix,1);save();render();checkBadges();break;
    case "setName":var inp=$("#nameIn");if(inp){S.name=inp.value.trim().slice(0,20);save();render();}break;
    case "theme":S.theme=el.getAttribute("data-t");save();applyTheme();render();break;
    case "askReset":V.confirmReset=true;render();break;
    case "cancelReset":V.confirmReset=false;render();break;
    case "reset":try{localStorage.removeItem(KEY);}catch(er){}S=DEFAULT_STATE();applyTheme();V.confirmReset=false;render();toast("Progress has been reset.");break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target;if(el.getAttribute("data-act")!=="req")return;
  var id=el.getAttribute("data-id"),i=parseInt(el.getAttribute("data-i"),10);
  var arr=S.reqs[id]=S.reqs[id]||[];arr[i]=el.checked;save();render();checkBadges();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="nameIn"){S.name=e.target.value.trim().slice(0,20);save();render();}
});
render();
})();
</script>
</body>
</html>
